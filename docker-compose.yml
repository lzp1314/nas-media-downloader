services:
  nas-media-downloader:
    # 方式一（默认）：直接拉 GitHub 自动构建的镜像，NAS 上不需要源码
    image: ghcr.io/lzp1314/nas-media-downloader:latest
    # 方式二：本地有源码时自己构建 —— 注释掉上面 image 行，启用下面这行
    # build: .
    container_name: nas-media-downloader
    restart: unless-stopped
    # 直接使用宿主网络：
    #  1. 部分片源站点只有 IPv6 在国内线路可达，host 网络让容器共享 NAS 的 IPv6
    #  2. BT 监听端口不再经过 NAT 转发，DHT 与 peer 连通性更好
    #  3. Web 端口由下面的 PORT 决定（默认 9696），不再需要 ports 映射
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - PORT=9696            # Web 界面端口：http://NAS地址:9696（与防火墙放行端口一致）
      - BT_PORT=51413        # BT 监听端口，host 模式下直接占用宿主端口
      - PUID=1000            # 飞牛用户 UID，SSH 执行 id 可查
      - PGID=1000
      - ARIA2_SECRET=nas_media_downloader_rpc   # 仅容器内部使用，可随手改
      - ACCESS_PASSWORD=     # 留空则局域网免密；填了打开网页要先输密码
      # /media 下的每个一级目录就是一个片库，库名取目录名，无需额外配置
      - MEDIA_ROOT=/media
      - DOWNLOADS_DIR=/media/影视   # aria2 的兜底下载目录
    volumes:
      # 左边是 NAS 上的真实路径，右边保持不动（右边决定界面上显示的名字）
      - /vol1/1000/影视:/media/影视
      - /vol4/1000/影视资源:/media/影视资源
      # 配置、登录态、aria2 会话（sites.json 已被 .gitignore 排除）
      - ./config:/config
